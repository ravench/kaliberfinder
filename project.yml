name: Kaliberfinder
options:
  bundleIdPrefix: ch.giotta
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
targets:
  Kaliberfinder:
    type: application
    platform: iOS
    sources: [Kaliberfinder]
    info:
      path: Kaliberfinder/Info.plist
      properties:
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de, en, fr, it]
        # Opened by the share extension once it has put a shared photo into the App Group inbox.
        CFBundleURLTypes:
          - CFBundleURLName: ch.giotta.kaliberfinder
            CFBundleURLSchemes: [kaliberfinder]
    entitlements:
      path: Kaliberfinder/Kaliberfinder.entitlements
      properties:
        # Shared with the share extension (SharedInbox.appGroup).
        com.apple.security.application-groups:
          - group.ch.giotta.kaliberfinder
    dependencies:
      # Embeds the share extension in the app.
      - target: KaliberfinderShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.giotta.kaliberfinder
        # Signing team of the maintainer. Forks: replace with your own team ID (or remove it and pick a team in Xcode).
        DEVELOPMENT_TEAM: PD9YC6KM5T
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        # iPhone only: the real-size drawing needs each model's display density.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Kaliberfinder
        # No own encryption, only what iOS provides: skips the export compliance question per build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # German source; translations in Resources/InfoPlist.xcstrings (tools/localize.py).
        INFOPLIST_KEY_NSCameraUsageDescription: "Patronen fotografieren, um das Kaliber zu erkennen."
  KaliberfinderShare:
    # "Kaliberfinder" in the share sheet of Photos, Files, Messages …: hands photos to the app.
    type: app-extension
    platform: iOS
    sources:
      - KaliberfinderShare
      - Kaliberfinder/Services/SharedInbox.swift
      - Kaliberfinder/Services/L10n.swift
      - Kaliberfinder/Resources/Localizable.xcstrings
    info:
      path: KaliberfinderShare/Info.plist
      properties:
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de, en, fr, it]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              # One side photo (SharedInbox.maxPhotos).
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: KaliberfinderShare/KaliberfinderShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ch.giotta.kaliberfinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.giotta.kaliberfinder.share
        DEVELOPMENT_TEAM: PD9YC6KM5T
        CODE_SIGN_STYLE: Automatic
        # Must match the app's, or App Store Connect rejects the upload.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kaliberfinder
  KaliberfinderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KaliberfinderTests
        excludes: ["Captures/**"]
      # Training capture packages (TrainingCapture) as a folder, so their shots keep their own
      # subfolders: every shot has a photo.jpg and a shot.json.
      - path: KaliberfinderTests/Captures
        type: folder
    dependencies:
      - target: Kaliberfinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.giotta.kaliberfinder.tests
        DEVELOPMENT_TEAM: PD9YC6KM5T
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
  KaliberfinderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [KaliberfinderUITests]
    dependencies:
      - target: Kaliberfinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.giotta.kaliberfinder.uitests
        DEVELOPMENT_TEAM: PD9YC6KM5T
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Kaliberfinder
schemes:
  Kaliberfinder:
    build:
      targets:
        Kaliberfinder: all
        KaliberfinderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - KaliberfinderTests
    archive:
      config: Release
  # Own scheme so the screen tour (.github/workflows/pr-screens.yml) stays out of the unit test run.
  KaliberfinderScreens:
    build:
      targets:
        Kaliberfinder: all
        KaliberfinderUITests: [test]
    test:
      config: Debug
      targets:
        - KaliberfinderUITests
